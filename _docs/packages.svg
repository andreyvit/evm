<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 536" width="680" role="img" aria-labelledby="title desc">
<title id="title">Package layers</title>
<desc id="desc">Seven layers, from gox at the top to values at the bottom. Each package imports only packages below it.</desc>
<style>
.t { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
.s { font: 12px -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
.l { font: 12px -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; fill: #888780; }
</style>
<rect x="40" y="20" width="600" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="340" y="44" fill="#3C3489">gox</text>
<text class="s" x="340" y="62" fill="#534AB7">typed HTML templates</text>
<rect x="40" y="88" width="600" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="340" y="112" fill="#3C3489">evmbind</text>
<text class="s" x="340" y="130" fill="#534AB7">host API bindings</text>
<rect x="40" y="156" width="294" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="187" y="180" fill="#3C3489">evmcompiler</text>
<text class="s" x="187" y="198" fill="#534AB7">Go source to bytecode</text>
<rect x="346" y="156" width="294" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="493" y="180" fill="#3C3489">evmasm</text>
<text class="s" x="493" y="198" fill="#534AB7">assembler</text>
<rect x="40" y="224" width="396" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="238" y="248" fill="#3C3489">evm</text>
<text class="s" x="238" y="266" fill="#534AB7">VM, linker, standard library</text>
<rect x="448" y="224" width="192" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="544" y="248" fill="#085041">kvo/codec/fast1</text>
<text class="s" x="544" y="266" fill="#0F6E56">legacy row codec</text>
<rect x="40" y="292" width="600" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="340" y="316" fill="#085041">kvo</text>
<text class="s" x="340" y="334" fill="#0F6E56">models, records, editors</text>
<rect x="40" y="360" width="192" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="136" y="384" fill="#085041">nativebind</text>
<text class="s" x="136" y="402" fill="#0F6E56">native field access</text>
<rect x="244" y="360" width="192" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="340" y="384" fill="#085041">kvo/codec/row2</text>
<text class="s" x="340" y="402" fill="#0F6E56">Fast2 and Compact2 rows</text>
<rect x="448" y="360" width="192" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="544" y="384" fill="#085041">kvo/codec/msgpack</text>
<text class="s" x="544" y="402" fill="#0F6E56">legacy row codec</text>
<rect x="40" y="428" width="396" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="238" y="452" fill="#085041">values</text>
<text class="s" x="238" y="470" fill="#0F6E56">two-word Value and types</text>
<rect x="448" y="428" width="192" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="544" y="452" fill="#3C3489">evmruntime</text>
<text class="s" x="544" y="470" fill="#534AB7">Ambient; imports nothing</text>
<rect x="40" y="504" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<text class="l" x="58" y="514">VM and language</text>
<rect x="178" y="504" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="l" x="196" y="514">data model and values</text>
<text class="l" x="640" y="514" text-anchor="end">Each package imports only packages below it</text>
</svg>
